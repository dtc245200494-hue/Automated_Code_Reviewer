name: Finalize project scan UI v2

on:
  push:
    branches:
      - fix/groq-large-file-project-scan
    paths:
      - .github/workflows/finalize-project-scan-ui-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-large-file-project-scan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Inject project UI after OpenCode extension
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.js')
          text = p.read_text(encoding='utf-8')
          if 'project-scan-ui.js' not in text:
              needle = '<script src="opencode-models.js"></script>'
              if needle not in text:
                  raise SystemExit('opencode script marker not found')
              text = text.replace(needle, needle + '\\n  <script src="project-scan-ui.js"></script>', 1)
          p.write_text(text, encoding='utf-8')

      - name: Add UI regression test
        run: |
          cat > test/project-ui.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const ui = fs.readFileSync(new URL('../public/project-scan-ui.js', import.meta.url), 'utf8');
          const server = fs.readFileSync(new URL('../server.js', import.meta.url), 'utf8');

          test('project UI adapter is injected', () => assert.ok(server.includes('project-scan-ui.js')));
          test('folder scan uses project endpoint', () => assert.ok(ui.includes("fetch('/api/scan-project'")));
          test('project queue is visible', () => assert.ok(ui.includes('Project Scan Queue')));
          test('limited AI coverage is not treated as full clean', () => {
            assert.ok(ui.includes('limited_coverage'));
            assert.ok(ui.includes('KHÔNG CÓ FINDING TRONG PHẦN AI ĐÃ KIỂM TRA'));
            assert.ok(ui.includes('Scan coverage:'));
          });
          test('generated and minified paths are filtered', () => {
            assert.ok(ui.includes('node_modules|dist|build|vendor|coverage'));
            assert.ok(ui.includes('\\.min\\.'));
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Syntax check adapter
        run: node --check public/project-scan-ui.js

      - name: Run full tests
        run: npm test

      - name: Commit tested UI and clean helper workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-project-scan-ui-v2.yml
          git rm -f .github/workflows/finalize-project-scan-ui.yml || true
          git rm -f .github/workflows/apply-project-scan-ui.yml || true
          git add server.js public/project-scan-ui.js test/project-ui.test.js
          git commit -m "feat: enable project scan queue and coverage-aware UI"
          git push origin HEAD:fix/groq-large-file-project-scan
