name: 🔐 AI Security Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  security-review:
    name: Rà soát Lỗ hổng Bảo mật bằng AI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scanner regression tests
        run: npm test

      - name: Run AI Security Review
        uses: ./legacy-bot-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: https://api.openai.com/v1
          MODEL: gpt-5.6-terra
          USE_GITHUB_MODELS: false
          LANGUAGE: Tiếng Việt
          max_tokens: 4000
          MAX_PATCH_LENGTH: 10000
          IGNORE_PATTERNS: "*.md,*.txt,*.json,*.lock,*.yml,*.yaml,node_modules/**,dist/**,build/**"
