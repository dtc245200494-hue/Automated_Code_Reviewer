name: Wire project scanning UI and coverage states

on:
  push:
    branches:
      - fix/groq-large-file-project-scan
    paths:
      - .github/workflows/apply-project-scan-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-large-file-project-scan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch frontend project scanning flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('public/app.js')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              "let currentActiveReport = null; // Lưu báo cáo hiện tại để xuất file",
              "let currentActiveReport = null; // Lưu báo cáo hiện tại để xuất file\nlet lastProjectScanMeta = null; // Metadata queue/batch/cross-file của lượt quét project gần nhất"
          )

          text = text.replace(
              "if (p.includes('node_modules/') || p.includes('.git/') || p.includes('dist/') || p.includes('.idea/')) {",
              "if (p.includes('node_modules/') || p.includes('.git/') || p.includes('dist/') || p.includes('build/') || p.includes('vendor/') || p.includes('coverage/') || p.includes('.idea/') || /\\.min\\.(js|css)$/i.test(p)) {"
          )

          text = text.replace("const prov = config?.provider || 'opencode';", "const prov = config?.provider || 'groq';")

          old_status = "const provName = clientConfig.provider === 'openai' ? 'OpenAI' : 'Groq AI';"
          new_status = "const providerNames = { openai: 'OpenAI', groq: 'Groq AI', gemini: 'Google Gemini', deepseek: 'DeepSeek', openrouter: 'OpenRouter', opencode: 'OpenCode.ai', custom: 'Universal AI' };\n      const provName = providerNames[clientConfig.provider] || clientConfig.provider || 'Custom AI';"
          text = text.replace(old_status, new_status)

          text = text.replace(
              "const model = apiModelInput.value.trim() || 'deepseek-v4-flash-free';",
              "const providerDefaultModels = { groq: 'llama-3.3-70b-versatile', opencode: 'deepseek-v4-flash-free', gemini: 'gemini-1.5-flash', deepseek: 'deepseek-chat', openrouter: 'meta-llama/llama-3.3-70b-instruct:free', openai: 'gpt-4o-mini' };\n  const model = apiModelInput.value.trim() || providerDefaultModels[provider] || 'llama-3.3-70b-versatile';"
          )

          old_tree = """      if (file.result.incomplete) {
                badgeHtml = `<span class=\"tree-badge\" style=\"background: rgba(210, 153, 34, 0.2); color: #d29922;\">Chưa xong</span>`;
              } else if (file.result.is_safe) {
                badgeHtml = `<span class=\"tree-badge safe\">Clean</span>`;
              } else {"""
          new_tree = """      if (file.result.incomplete) {
                badgeHtml = `<span class=\"tree-badge\" style=\"background: rgba(210, 153, 34, 0.2); color: #d29922;\">Chưa xong</span>`;
              } else if (file.result.limited_coverage) {
                const coverage = Number(file.result.ai_coverage_percent || 0).toFixed(1).replace('.0', '');
                badgeHtml = `<span class=\"tree-badge\" style=\"background: rgba(210, 153, 34, 0.2); color: #d29922;\">AI ${coverage}%</span>`;
              } else if (file.result.is_safe) {
                badgeHtml = `<span class=\"tree-badge safe\">Clean</span>`;
              } else {"""
          if old_tree not in text:
              raise SystemExit('renderFileTree target not found')
          text = text.replace(old_tree, new_tree)

          start = text.index('async function handleScanAllFolder() {')
          end = text.index('// Render Dashboard Thống Kê Tổng Quan Của Thư Mục', start)
          new_folder = r'''async function handleScanAllFolder() {
            if (!uploadedFiles.length || isScanning) return;
            isScanning = true;
            scanAllFolderBtn.disabled = true;
            scanBtn.disabled = true;
            scanAllFolderBtn.textContent = '⏳ Đang quét project...';

            const startTime = Date.now();
            resultsContainer.innerHTML = `
              <div class="loading-box">
                <div class="spinner"></div>
                <div style="text-align:center; width:100%; max-width:560px;">
                  <h3 style="margin-bottom:6px;">Đang quét toàn bộ project (${uploadedFiles.length} file)</h3>
                  <p style="color:var(--text-muted); font-size:0.85rem; line-height:1.6;">
                    Server đang lọc file sinh tự động, gom các file nhỏ vào batch, chạy queue tuần tự theo quota và kiểm tra dependency HTML ↔ JS / import ↔ module.
                  </p>
                  <div class="scan-stage-badge" style="margin-top:12px;">⚡ Project Scan Queue · Groq-friendly</div>
                </div>
              </div>`;

            try {
              const clientConfig = getStoredApiConfig();
              const scanPayload = {
                files: uploadedFiles.map(file => ({
                  name: file.name,
                  path: file.path,
                  content: file.content,
                  language: file.language || 'auto'
                }))
              };
              if (clientConfig && clientConfig.apiKey) Object.assign(scanPayload, clientConfig);

              const res = await fetch('/api/scan-project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(scanPayload)
              });
              const data = await res.json();
              if (!res.ok || !data.success || !data.result) {
                throw new Error(data.error || `Lỗi HTTP ${res.status}`);
              }

              lastProjectScanMeta = data.result;
              const resultByPath = new Map((data.result.file_results || []).map(item => [item.path, item.result]));
              const duration = ((Date.now() - startTime) / 1000).toFixed(2);

              let totalVulns = 0;
              let successCount = 0;
              let failedCount = 0;
              let incompleteCount = 0;
              let limitedCoverageCount = 0;
              let vulnFilesCount = 0;

              uploadedFiles.forEach(file => {
                const result = resultByPath.get(file.path);
                file.duration = duration;
                if (!result) {
                  file.result = null;
                  file.scanError = 'Server không trả kết quả cho file này.';
                  failedCount++;
                  return;
                }
                file.result = result;
                file.scanError = result.scan_error || null;
                if (file.scanError) {
                  failedCount++;
                  return;
                }
                successCount++;
                if (result.incomplete) incompleteCount++;
                else if (result.limited_coverage) limitedCoverageCount++;
                const count = result.vulnerabilities ? result.vulnerabilities.length : 0;
                if (count > 0) {
                  totalVulns += count;
                  vulnFilesCount++;
                }
              });

              if (totalVulns > 0) {
                summaryAlertBadge.style.display = 'inline-block';
                summaryAlertBadge.textContent = totalVulns;
              } else {
                summaryAlertBadge.style.display = 'none';
              }

              const scanStatus = data.result.status || (
                failedCount > 0 ? 'partial_error' :
                incompleteCount > 0 ? 'incomplete' :
                totalVulns > 0 ? 'vulnerable' :
                limitedCoverageCount > 0 ? 'limited_coverage' : 'safe'
              );

              saveScanHistoryItem({
                type: 'folder_scan',
                title: `Project scan (${successCount}/${uploadedFiles.length} file)`,
                total_files: uploadedFiles.length,
                scanned_files: successCount,
                success_files: successCount,
                failed_files: failedCount,
                incomplete_files: incompleteCount,
                limited_coverage_files: limitedCoverageCount,
                vuln_files: vulnFilesCount,
                total_vulns: totalVulns,
                status: scanStatus,
                project_stats: data.result.stats || null,
                dependency_graph: data.result.dependency_graph || {},
                project_findings: data.result.project_findings || [],
                snapshotFiles: uploadedFiles.map(f => ({
                  name: f.name,
                  path: f.path,
                  content: f.content,
                  language: f.language,
                  duration: f.duration,
                  result: f.result,
                  scanError: f.scanError || null
                }))
              });

              renderFileTree();
              switchViewTab('summary');
            } catch (err) {
              console.error(err);
              renderSystemError({
                error: `Không thể hoàn tất project scan: ${err.message}`,
                provider: getStoredApiConfig()?.provider || 'Server AI',
                model: getStoredApiConfig()?.model || 'N/A'
              });
            } finally {
              isScanning = false;
              scanAllFolderBtn.disabled = false;
              scanBtn.disabled = false;
              scanAllFolderBtn.textContent = '⚡ Quét tất cả file';
            }
          }

          '''
          text = text[:start] + new_folder + text[end:]

          old_loop = r'''  uploadedFiles.forEach(f => {
            if (f.scanError) {
              failedFiles++;
            } else if (f.result) {
              scannedFiles++;
              if (f.result.incomplete) {
                incompleteFiles++;
              }
              if (f.result.is_safe) {
                safeFiles++;
              } else {
                vulnFiles++;
                totalVulns += (f.result.vulnerabilities ? f.result.vulnerabilities.length : 0);
              }
            }
          });'''
          new_loop = r'''  let limitedCoverageFiles = 0;

          uploadedFiles.forEach(f => {
            if (f.scanError) {
              failedFiles++;
            } else if (f.result) {
              scannedFiles++;
              if (f.result.incomplete) incompleteFiles++;
              if (f.result.limited_coverage && !f.result.incomplete) limitedCoverageFiles++;
              const count = f.result.vulnerabilities ? f.result.vulnerabilities.length : 0;
              if (count > 0) {
                vulnFiles++;
                totalVulns += count;
              } else if (f.result.is_safe && !f.result.limited_coverage && !f.result.incomplete) {
                safeFiles++;
              }
            }
          });'''
          if old_loop not in text:
              raise SystemExit('folder summary loop not found')
          text = text.replace(old_loop, new_loop)

          old_meta = '''      📊 Tổng quan | ${scannedFiles}/${totalFiles} file đã quét ${failedFiles > 0 ? `(${failedFiles} file lỗi)` : ''}'''
          new_meta = '''      📊 Tổng quan | ${scannedFiles}/${totalFiles} file đã quét ${failedFiles > 0 ? `(${failedFiles} file lỗi)` : ''}${lastProjectScanMeta?.stats ? ` · ${lastProjectScanMeta.stats.scan_groups} queue group · ${lastProjectScanMeta.stats.batched_groups} batch · ${lastProjectScanMeta.stats.cross_file_checks} cross-file check` : ''}'''
          text = text.replace(old_meta, new_meta)

          incomplete_banner = '''  } else if (incompleteFiles > 0) {
            bannerClass = 'vulnerable';
            bannerIcon = '⚠️';
            bannerTitle = `CÓ ${incompleteFiles} FILE QUÉT CHƯA HOÀN TẤT ĐẦY ĐỦ`;
            bannerDesc = 'Một số tệp có phân đoạn quét chưa hoàn tất hoặc gặp giới hạn token AI.';
          } else if (scannedFiles < totalFiles) {'''
          limited_banner = '''  } else if (incompleteFiles > 0) {
            bannerClass = 'vulnerable';
            bannerIcon = '⚠️';
            bannerTitle = `CÓ ${incompleteFiles} FILE QUÉT CHƯA HOÀN TẤT ĐẦY ĐỦ`;
            bannerDesc = 'Một số tệp có phân đoạn quét chưa hoàn tất hoặc gặp giới hạn/quota AI.';
          } else if (limitedCoverageFiles > 0) {
            bannerClass = 'vulnerable';
            bannerIcon = '🔎';
            bannerTitle = `${limitedCoverageFiles} FILE LỚN ĐƯỢC QUÉT THEO TARGETED + SAMPLING`;
            bannerDesc = 'Heuristic đã rà toàn file, nhưng AI chỉ đọc các vùng rủi ro và vùng sampling. Hãy xem phần AI coverage của từng file; trạng thái này không được coi là full-scan Clean.';
          } else if (scannedFiles < totalFiles) {'''
          if incomplete_banner not in text:
              raise SystemExit('folder banner target not found')
          text = text.replace(incomplete_banner, limited_banner)

          old_desc = '''      if (file.result.incomplete) {
                statusText = '<span class="tree-badge" style="background: rgba(210,153,34,0.2); color:#d29922;">⚠️ Chưa xong</span>';
                descText = file.result.overall_summary || 'Quét chưa hoàn tất đầy đủ';
              } else if (file.result.is_safe) {'''
          new_desc = '''      if (file.result.incomplete) {
                statusText = '<span class="tree-badge" style="background: rgba(210,153,34,0.2); color:#d29922;">⚠️ Chưa xong</span>';
                descText = file.result.overall_summary || 'Quét chưa hoàn tất đầy đủ';
              } else if (file.result.limited_coverage) {
                statusText = `<span class="tree-badge" style="background: rgba(210,153,34,0.2); color:#d29922;">🔎 AI ${Number(file.result.ai_coverage_percent || 0).toFixed(1)}%</span>`;
                descText = file.result.overall_summary || 'AI coverage có chọn mẫu';
              } else if (file.result.is_safe) {'''
          if old_desc not in text:
              raise SystemExit('folder row result target not found')
          text = text.replace(old_desc, new_desc)

          text = text.replace(
              "status: !data.result.is_safe ? 'vulnerable' : (data.result.incomplete ? 'incomplete' : 'safe'),",
              "status: data.result.incomplete ? 'incomplete' : (!data.result.is_safe ? 'vulnerable' : (data.result.limited_coverage ? 'limited_coverage' : 'safe'))," 
          )

          old_engine = "const engineLabel = result.source === 'ai_live' ? `AI Engine (${result.model_used})` : 'Heuristic Engine';"
          new_engine = "const engineLabel = result.source?.startsWith('ai_') ? `AI Engine (${result.model_used || 'project'})` : (result.source === 'heuristic_engine' ? 'Heuristic Engine' : (result.model_used ? `AI Engine (${result.model_used})` : 'Security Engine'));"
          text = text.replace(old_engine, new_engine)

          banner_start = text.index("  let html = '';\n\n  if (isSafe) {", text.index('function renderReport(result, duration)'))
          banner_end = text.index("\n\n  if (result.notice) {", banner_start)
          replacement_banner = r'''  let html = '';
            const limitedCoverage = Boolean(result.limited_coverage && !result.incomplete);

            if (result.incomplete) {
              html += `
                <div class="report-header-banner vulnerable">
                  <div class="banner-status-icon">⚠️</div>
                  <div class="banner-status-info">
                    <h3>QUÉT CHƯA HOÀN TẤT - KHÔNG THỂ KẾT LUẬN AN TOÀN</h3>
                    <p>${escapeHtml(result.overall_summary || 'Có request/chunk chưa hoàn thành.')}</p>
                  </div>
                </div>`;
            } else if (isSafe && limitedCoverage) {
              html += `
                <div class="report-header-banner vulnerable">
                  <div class="banner-status-icon">🔎</div>
                  <div class="banner-status-info">
                    <h3>KHÔNG CÓ FINDING TRONG PHẦN AI ĐÃ KIỂM TRA</h3>
                    <p>${escapeHtml(result.overall_summary || 'File lớn đang dùng targeted + coverage sampling; AI chưa đọc toàn bộ file.')}</p>
                  </div>
                </div>`;
            } else if (isSafe) {
              html += `
                <div class="report-header-banner safe">
                  <div class="banner-status-icon">🛡️</div>
                  <div class="banner-status-info">
                    <h3>MÃ NGUỒN AN TOÀN (LGTM)</h3>
                    <p>${escapeHtml(result.overall_summary || 'Không tìm thấy dấu hiệu lỗ hổng OWASP Top 10 phổ biến trong đoạn mã này.')}</p>
                  </div>
                </div>`;
            } else {
              html += `
                <div class="report-header-banner vulnerable">
                  <div class="banner-status-icon">🚨</div>
                  <div class="banner-status-info">
                    <h3>PHÁT HIỆN ${vulns.length} LỖ HỔNG BẢO MẬT</h3>
                    <p>${escapeHtml(result.overall_summary || 'Cần khắc phục các rủi ro bảo mật trước khi đưa vào sản phẩm.')}</p>
                  </div>
                </div>`;
            }

            if (Number.isFinite(Number(result.total_lines))) {
              const aiCoverage = Number(result.ai_coverage_percent || 0);
              const heuristicCoverage = Number(result.heuristic_coverage_percent || 0);
              html += `
                <div style="padding:12px 14px; background:rgba(56,139,253,0.08); border:1px solid rgba(56,139,253,0.25); border-radius:7px; margin-bottom:16px; font-size:0.8rem; line-height:1.7;">
                  <strong>📊 Scan coverage:</strong>
                  File ${Number(result.total_lines).toLocaleString('vi-VN')} dòng ·
                  AI ${aiCoverage.toFixed(1)}% (${Number(result.ai_covered_lines || 0).toLocaleString('vi-VN')} dòng) ·
                  Heuristic ${heuristicCoverage.toFixed(0)}% ·
                  ${Number(result.targeted_chunk_count || 0)} targeted · ${Number(result.sample_chunk_count || 0)} sampling ·
                  chiến lược <code>${escapeHtml(result.scan_strategy || 'n/a')}</code>
                </div>`;
            }'''
          text = text[:banner_start] + replacement_banner + text[banner_end:]

          p.write_text(text, encoding='utf-8')

      - name: Add static UI tests
        run: |
          cat > test/project-ui.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const app = fs.readFileSync(new URL('../public/app.js', import.meta.url), 'utf8');

          test('folder scan uses project endpoint instead of per-file scan loop', () => {
            assert.ok(app.includes("fetch('/api/scan-project'"));
            assert.ok(app.includes('Project Scan Queue'));
          });

          test('UI exposes limited AI coverage distinctly from clean', () => {
            assert.ok(app.includes('file.result.limited_coverage'));
            assert.ok(app.includes('KHÔNG CÓ FINDING TRONG PHẦN AI ĐÃ KIỂM TRA'));
            assert.ok(app.includes('Scan coverage:'));
          });

          test('folder upload skips generated/minified paths', () => {
            assert.ok(app.includes("p.includes('build/')"));
            assert.ok(app.includes('\\.min\\.(js|css)'));
          });
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit UI patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-project-scan-ui.yml
          git add public/app.js test/project-ui.test.js
          git commit -m "feat: wire folder project scan and coverage-aware UI"
          git push origin HEAD:fix/groq-large-file-project-scan
