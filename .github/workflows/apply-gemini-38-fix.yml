name: Apply Gemini 3.8 defaults fix

on:
  push:
    branches:
      - fix/gemini-3.8-defaults
    paths:
      - .github/workflows/apply-gemini-38-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-3.8-defaults
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, expected_min=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f'{path}: expected at least {expected_min} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s)')

          replace_exact(
              'services/scanner.js',
              "if (provider === 'gemini' || firstKey.startsWith('AIzaSy')) return 'gemini-1.5-flash';",
              "if (provider === 'gemini' || firstKey.startsWith('AIzaSy')) return 'gemini-3.8-flash';"
          )

          replace_exact('public/app.js', "apiModelInput.placeholder = 'gemini-1.5-flash';", "apiModelInput.placeholder = 'gemini-3.8-flash';")
          replace_exact(
              'public/app.js',
              "modelHintText.innerHTML = 'Gợi ý Google: <code>gemini-1.5-flash</code> (siêu nhanh, miễn phí), <code>gemini-1.5-pro</code>';",
              "modelHintText.innerHTML = 'Gợi ý Google: <code>gemini-3.8-flash</code> (GA, nhanh, phù hợp rà soát code), <code>gemini-3.6-flash</code>';"
          )
          replace_exact("public/app.js", "apiModelInput.value = 'gemini-1.5-flash';", "apiModelInput.value = 'gemini-3.8-flash';")

          replace_exact(
              'public/app.js',
              "const provName = clientConfig.provider === 'openai' ? 'OpenAI' : 'Groq AI';",
              "const providerNames = { openai: 'OpenAI', groq: 'Groq AI', gemini: 'Google Gemini', deepseek: 'DeepSeek', openrouter: 'OpenRouter', opencode: 'OpenCode.ai', custom: 'Universal AI' };\n      const provName = providerNames[clientConfig.provider] || clientConfig.provider || 'Custom AI';"
          )

          replace_exact(
              'public/custom-provider.js',
              "'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'gemini-1.5-flash', 'gemini-1.5-pro',",
              "'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-1.5-flash', 'gemini-1.5-pro',"
          )

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-gemini-38-fix.yml
          git add services/scanner.js public/app.js public/custom-provider.js
          git commit -m "fix: align Gemini 3.8 defaults and provider labels"
          git push origin HEAD:fix/gemini-3.8-defaults
