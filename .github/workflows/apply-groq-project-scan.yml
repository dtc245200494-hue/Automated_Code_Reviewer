name: Apply Groq large-file and project scanner patch

on:
  push:
    branches:
      - fix/groq-large-file-project-scan
    paths:
      - .github/workflows/apply-groq-project-scan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-large-file-project-scan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Revert unrelated Gemini patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 0504e9898c18484e1d9ab9e08fc3a0e410df4dc6

      - name: Add Groq scanner v2
        run: |
          cat > services/groq-scanner.js <<'EOF'
          import { ScannerService as BaseScannerService, DEFAULT_OPENCODE_API_KEY } from './scanner.js';

          export { DEFAULT_OPENCODE_API_KEY };

          export const SINGLE_REQUEST_MAX_LINES = Number.parseInt(process.env.SCAN_SINGLE_LIMIT || '400', 10);
          export const CHUNK_SIZE = Number.parseInt(process.env.SCAN_CHUNK_SIZE || '450', 10);
          export const CHUNK_OVERLAP = Number.parseInt(process.env.SCAN_CHUNK_OVERLAP || '50', 10);
          export const LARGE_FILE_THRESHOLD = Number.parseInt(process.env.SCAN_LARGE_THRESHOLD || '3000', 10);
          export const TARGETED_WINDOW_PADDING = Number.parseInt(process.env.SCAN_TARGET_PADDING || '40', 10);
          export const MAX_TARGETED_CHUNKS = Number.parseInt(process.env.SCAN_MAX_TARGETED_CHUNKS || '8', 10);
          export const MAX_LARGE_FILE_CHUNKS = Number.parseInt(process.env.SCAN_MAX_LARGE_CHUNKS || '10', 10);
          export const COVERAGE_SAMPLE_COUNT = Number.parseInt(process.env.SCAN_COVERAGE_SAMPLES || '3', 10);
          export const COVERAGE_SAMPLE_SIZE = Number.parseInt(process.env.SCAN_COVERAGE_SAMPLE_SIZE || '300', 10);
          const DEFAULT_RETRIES = 2;
          const DEFAULT_MAX_CONCURRENCY = 1;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function normalizeText(value) {
            return typeof value === 'string' ? value.trim() : '';
          }

          function normalizeRecommendations(items) {
            if (!Array.isArray(items)) return [];
            const out = [];
            for (const item of items) {
              if (typeof item === 'string' && item.trim()) out.push(item.trim());
              else if (item && typeof item === 'object') {
                const text = item.recommendation || item.title || item.desc || item.description || item.text;
                if (typeof text === 'string' && text.trim()) out.push(text.trim());
              }
            }
            return [...new Set(out)];
          }

          function normalizeVulnerability(vuln) {
            if (!vuln || typeof vuln !== 'object') return null;
            const rawStart = Number.parseInt(vuln.start_line ?? vuln.line_number, 10);
            const startLine = Number.isFinite(rawStart) && rawStart > 0 ? rawStart : 1;
            const rawEnd = Number.parseInt(vuln.end_line ?? vuln.start_line ?? vuln.line_number, 10);
            const endLine = Number.isFinite(rawEnd) && rawEnd >= startLine ? rawEnd : startLine;
            return {
              ...vuln,
              type: normalizeText(vuln.type || vuln.title || vuln.name) || 'Security finding',
              severity: normalizeText(vuln.severity || vuln.risk) || 'Trung bình',
              owasp_category: normalizeText(vuln.owasp_category || vuln.owasp),
              cwe: normalizeText(vuln.cwe || vuln.cwe_id) || 'CWE-Other',
              confidence: normalizeText(vuln.confidence) || 'Cao',
              start_line: startLine,
              end_line: endLine,
              line_number: startLine,
              start_column: Number.parseInt(vuln.start_column, 10) > 0 ? Number.parseInt(vuln.start_column, 10) : 1,
              end_column: Number.parseInt(vuln.end_column, 10) > 0 ? Number.parseInt(vuln.end_column, 10) : null,
              affected_lines: normalizeText(vuln.affected_lines || vuln.code || vuln.snippet),
              explanation: normalizeText(vuln.explanation || vuln.description || vuln.reason),
              attack_scenario: normalizeText(vuln.attack_scenario || vuln.exploit || vuln.scenario),
              remediation: normalizeText(vuln.remediation || vuln.fix || vuln.recommendation),
              fixed_code: normalizeText(vuln.fixed_code || vuln.safe_code),
              impact: normalizeText(vuln.impact)
            };
          }

          function dedupeVulnerabilities(items) {
            const seen = new Set();
            const out = [];
            for (const raw of items || []) {
              const vuln = normalizeVulnerability(raw);
              if (!vuln) continue;
              const key = [
                normalizeText(vuln.file).toLowerCase(),
                vuln.type.toLowerCase(),
                vuln.start_line,
                vuln.end_line,
                vuln.affected_lines.toLowerCase().replace(/\s+/g, ' ').slice(0, 180)
              ].join('|');
              if (seen.has(key)) continue;
              seen.add(key);
              out.push(vuln);
            }
            return out.sort((a, b) => a.start_line - b.start_line || a.end_line - b.end_line);
          }

          export function getAiErrorStatus(err) {
            const status = Number(err?.status || err?.statusCode || err?.response?.status || 0);
            if (Number.isFinite(status) && status > 0) return status;
            const msg = String(err?.message || '');
            const match = msg.match(/\b(401|403|404|429)\b/);
            return match ? Number(match[1]) : 0;
          }

          export function isFatalAiError(err) {
            if (!err) return false;
            const status = getAiErrorStatus(err);
            if ([401, 403, 404, 429].includes(status)) return true;
            const msg = String(err.message || '').toLowerCase();
            return /rate limit|quota|resource_exhausted|unauthorized|invalid[_ ]api[_ ]key|forbidden|permission_denied|model.*not found|endpoint.*not found/.test(msg);
          }

          function isRateLimitError(err) {
            const status = getAiErrorStatus(err);
            const msg = String(err?.message || '').toLowerCase();
            return status === 429 || /rate limit|quota|resource_exhausted/.test(msg);
          }

          function retryAfterMs(err) {
            const headers = err?.headers || err?.response?.headers;
            let value = null;
            if (headers?.get) value = headers.get('retry-after') || headers.get('Retry-After');
            else if (headers) value = headers['retry-after'] || headers['Retry-After'];
            if (Array.isArray(value)) value = value[0];
            if (value !== null && value !== undefined && value !== '') {
              const seconds = Number(value);
              if (Number.isFinite(seconds)) return Math.max(250, Math.min(seconds * 1000, 30000));
              const dateMs = Date.parse(String(value));
              if (Number.isFinite(dateMs)) return Math.max(250, Math.min(dateMs - Date.now(), 30000));
            }
            return 1200;
          }

          const RISK_PATTERNS = [
            { risk: 100, type: 'command-injection', regex: /\b(exec|execSync|spawn|spawnSync|popen|system)\s*\(.*(req\.|params|query|input|\+|\$\{)/i },
            { risk: 92, type: 'sql-injection', regex: /\b(select|insert|update|delete|drop|union|alter)\b.*(\+|\$\{)|(?:\+|\$\{).*\b(select|from|where|into)\b/i },
            { risk: 88, type: 'code-execution', regex: /\b(eval|Function)\s*\(/i },
            { risk: 86, type: 'hardcoded-secret', regex: /\b(api[_-]?key|secret(?:[_-]?key)?|password|passwd|token|private[_-]?key)\b\s*[:=]\s*["'`]([^"'`]{8,})["'`]/i },
            { risk: 80, type: 'path-traversal', regex: /(send_file|sendFile|readFile|createReadStream|openSync|path\.join|os\.path\.join)\s*\(.*(req\.|params|query|filename|input)/i },
            { risk: 78, type: 'ssrf', regex: /\b(fetch|axios|request|http\.get|https\.get)\s*\(.*(req\.|params|query|url|target)/i },
            { risk: 72, type: 'dom-xss', regex: /(innerHTML|outerHTML|insertAdjacentHTML|document\.write|dangerouslySetInnerHTML)/i },
            { risk: 66, type: 'jwt-misuse', regex: /jwt\.decode\s*\(/i },
            { risk: 60, type: 'weak-crypto', regex: /\b(createCipher|md5|sha1|des)\b/i }
          ];

          export function findSuspectRegions(code) {
            if (!code || typeof code !== 'string') return [];
            const lines = code.split('\n');
            const byLine = new Map();
            lines.forEach((line, index) => {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('//') || trimmed.startsWith('#') || trimmed.startsWith('/*') || trimmed.startsWith('*')) return;
              if (/(mock|example|placeholder|dummy|changeme)/i.test(trimmed)) return;
              for (const entry of RISK_PATTERNS) {
                entry.regex.lastIndex = 0;
                if (!entry.regex.test(trimmed)) continue;
                const lineNo = index + 1;
                const previous = byLine.get(lineNo);
                if (!previous || entry.risk > previous.risk) {
                  byLine.set(lineNo, { line: lineNo, risk: entry.risk, type: entry.type });
                }
              }
            });
            return [...byLine.values()].sort((a, b) => b.risk - a.risk || a.line - b.line);
          }

          export function findSuspectLines(code) {
            return findSuspectRegions(code).map(item => item.line).sort((a, b) => a - b);
          }

          export function buildTargetedChunks(allLines, suspectRegions, windowPadding = TARGETED_WINDOW_PADDING, maxChunkSize = CHUNK_SIZE) {
            if (!Array.isArray(suspectRegions) || suspectRegions.length === 0) return [];
            const total = allLines.length;
            const windows = suspectRegions
              .map(item => typeof item === 'number' ? { line: item, risk: 50, type: 'suspect' } : item)
              .filter(item => Number.isFinite(item.line))
              .map(item => ({
                start: Math.max(1, item.line - windowPadding),
                end: Math.min(total, item.line + windowPadding),
                risk: Number(item.risk) || 50,
                types: new Set([item.type || 'suspect'])
              }))
              .sort((a, b) => a.start - b.start);
            if (!windows.length) return [];

            const merged = [];
            let current = windows[0];
            for (let i = 1; i < windows.length; i++) {
              const next = windows[i];
              if (next.start <= current.end + 5) {
                current.end = Math.max(current.end, next.end);
                current.risk = Math.max(current.risk, next.risk);
                next.types.forEach(type => current.types.add(type));
              } else {
                merged.push(current);
                current = next;
              }
            }
            merged.push(current);

            const chunks = [];
            for (const win of merged) {
              const step = Math.max(1, maxChunkSize - CHUNK_OVERLAP);
              for (let start = win.start; start <= win.end; start += step) {
                const end = Math.min(start + maxChunkSize - 1, win.end);
                chunks.push({
                  chunkLines: allLines.slice(start - 1, end),
                  startLineNumber: start,
                  endLineNumber: end,
                  kind: 'targeted',
                  risk: win.risk,
                  riskTypes: [...win.types]
                });
                if (end >= win.end) break;
              }
            }
            return chunks;
          }

          export function buildCoverageSampleChunks(allLines, sampleCount = COVERAGE_SAMPLE_COUNT, sampleSize = COVERAGE_SAMPLE_SIZE) {
            const total = allLines.length;
            if (!total) return [];
            const size = Math.max(1, Math.min(sampleSize, CHUNK_SIZE, total));
            const count = Math.max(1, Math.min(sampleCount, Math.ceil(total / size)));
            const maxStart = Math.max(1, total - size + 1);
            const starts = new Set();
            if (count === 1) starts.add(1);
            else {
              for (let i = 0; i < count; i++) {
                starts.add(Math.round(1 + ((maxStart - 1) * i) / (count - 1)));
              }
            }
            return [...starts].sort((a, b) => a - b).map(start => {
              const end = Math.min(total, start + size - 1);
              return {
                chunkLines: allLines.slice(start - 1, end),
                startLineNumber: start,
                endLineNumber: end,
                kind: 'sample',
                risk: 0,
                riskTypes: []
              };
            });
          }

          function overlapRatio(a, b) {
            const start = Math.max(a.startLineNumber, b.startLineNumber);
            const end = Math.min(a.endLineNumber, b.endLineNumber);
            if (end < start) return 0;
            const overlap = end - start + 1;
            const minSpan = Math.min(a.endLineNumber - a.startLineNumber + 1, b.endLineNumber - b.startLineNumber + 1);
            return overlap / Math.max(1, minSpan);
          }

          export function selectLargeFileChunks(allLines, suspectRegions) {
            const targeted = buildTargetedChunks(allLines, suspectRegions)
              .sort((a, b) => b.risk - a.risk || a.startLineNumber - b.startLineNumber)
              .slice(0, Math.max(0, MAX_TARGETED_CHUNKS));
            const samples = buildCoverageSampleChunks(allLines)
              .filter(sample => targeted.every(target => overlapRatio(sample, target) < 0.6));
            const capacity = Math.max(1, MAX_LARGE_FILE_CHUNKS);
            const selected = [...targeted];
            for (const sample of samples) {
              if (selected.length >= capacity) break;
              selected.push(sample);
            }
            if (selected.length === 0) selected.push(...buildCoverageSampleChunks(allLines, 1));
            return selected.sort((a, b) => a.startLineNumber - b.startLineNumber);
          }

          function buildFullChunks(allLines) {
            const chunks = [];
            const step = Math.max(1, CHUNK_SIZE - CHUNK_OVERLAP);
            for (let start = 0; start < allLines.length; start += step) {
              const chunkLines = allLines.slice(start, Math.min(start + CHUNK_SIZE, allLines.length));
              chunks.push({
                chunkLines,
                startLineNumber: start + 1,
                endLineNumber: start + chunkLines.length,
                kind: 'full',
                risk: 0,
                riskTypes: []
              });
              if (start + CHUNK_SIZE >= allLines.length) break;
            }
            return chunks;
          }

          export function countCoveredLines(chunks, totalLines) {
            const intervals = (chunks || [])
              .filter(Boolean)
              .map(c => [Math.max(1, c.startLineNumber), Math.min(totalLines, c.endLineNumber)])
              .filter(([s, e]) => e >= s)
              .sort((a, b) => a[0] - b[0]);
            if (!intervals.length) return 0;
            let covered = 0;
            let [start, end] = intervals[0];
            for (let i = 1; i < intervals.length; i++) {
              const [s, e] = intervals[i];
              if (s <= end + 1) end = Math.max(end, e);
              else {
                covered += end - start + 1;
                [start, end] = [s, e];
              }
            }
            return covered + (end - start + 1);
          }

          function repairAiShape(parsed) {
            if (Array.isArray(parsed)) return { vulnerabilities: parsed, recommendations: [] };
            if (!parsed || typeof parsed !== 'object') return parsed;
            const candidates = [parsed.vulnerabilities, parsed.findings, parsed.issues, parsed.security_findings, parsed.results];
            const vulnerabilities = candidates.find(Array.isArray);
            const recommendations = Array.isArray(parsed.recommendations)
              ? parsed.recommendations
              : Array.isArray(parsed.suggestions)
                ? parsed.suggestions
                : [];
            return { ...parsed, vulnerabilities: vulnerabilities || [], recommendations };
          }

          function parseAiJson(raw) {
            const text = String(raw || '').trim();
            if (!text) throw new Error('AI trả về nội dung rỗng.');
            try { return JSON.parse(text); } catch {}
            const unfenced = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
            try { return JSON.parse(unfenced); } catch {}
            const firstObject = unfenced.indexOf('{');
            const lastObject = unfenced.lastIndexOf('}');
            if (firstObject >= 0 && lastObject > firstObject) {
              return JSON.parse(unfenced.slice(firstObject, lastObject + 1));
            }
            const firstArray = unfenced.indexOf('[');
            const lastArray = unfenced.lastIndexOf(']');
            if (firstArray >= 0 && lastArray > firstArray) {
              return JSON.parse(unfenced.slice(firstArray, lastArray + 1));
            }
            throw new Error('AI trả về JSON không thể parse/repair.');
          }

          async function mapSequential(items, worker, shouldAbort = () => false) {
            const results = [];
            for (let i = 0; i < items.length; i++) {
              if (shouldAbort()) break;
              results[i] = await worker(items[i], i);
            }
            return results;
          }

          export class ScannerService extends BaseScannerService {
            validateAiResult(parsed) {
              const repaired = repairAiShape(parsed);
              if (!repaired || typeof repaired !== 'object' || Array.isArray(repaired)) {
                throw new Error('AI trả về JSON không hợp lệ.');
              }
              if (!Array.isArray(repaired.vulnerabilities)) {
                throw new Error('AI response thiếu vulnerabilities/findings/issues[].');
              }
              const vulnerabilities = repaired.vulnerabilities.map(normalizeVulnerability).filter(Boolean);
              return {
                is_safe: vulnerabilities.length === 0,
                overall_summary: normalizeText(repaired.overall_summary || repaired.summary),
                vulnerabilities,
                recommendations: normalizeRecommendations(repaired.recommendations || [])
              };
            }

            async requestAi(client, model, prompt, retries = DEFAULT_RETRIES) {
              let normalRetries = 0;
              let rateLimitRetried = false;
              let lastError;
              while (true) {
                try {
                  const res = await client.chat.completions.create({
                    model,
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0.0,
                    response_format: { type: 'json_object' }
                  });
                  const raw = res.choices?.[0]?.message?.content;
                  return this.validateAiResult(parseAiJson(raw));
                } catch (err) {
                  lastError = err;
                  if (isRateLimitError(err)) {
                    if (!rateLimitRetried) {
                      rateLimitRetried = true;
                      await sleep(retryAfterMs(err));
                      continue;
                    }
                    throw err;
                  }
                  if (isFatalAiError(err)) throw err;
                  if (normalRetries >= retries) throw err;
                  await sleep(300 * (2 ** normalRetries));
                  normalRetries++;
                }
              }
              // istanbul ignore next
              throw lastError || new Error('AI scan thất bại.');
            }

            async scanCode(code, language = 'auto', customConfig = null) {
              if (!code || !code.trim()) throw new Error('Mã nguồn không được để trống.');

              const customKeys = this.parseApiKeys(customConfig?.apiKey || '');
              const provider = customConfig?.provider || (
                this.isCerebras ? 'cerebras' : this.isGroq ? 'groq' : this.isOpenCode ? 'opencode' : 'openai'
              );
              const firstKey = customKeys[0] || this.apiKey || '';
              const activeModel = customConfig?.model
                || (customConfig ? this.getDefaultModel(provider, firstKey) : this.model)
                || this.getDefaultModel(provider, firstKey);

              let clientPool = [];
              if (customKeys.length > 0) {
                clientPool = customKeys.map(key => this.createClient(key, provider, customConfig?.baseURL)).filter(Boolean);
              } else if (this.client) {
                clientPool = [this.client];
              }

              const allLines = code.split('\n');
              const totalLines = allLines.length;
              const heuristicRegions = findSuspectRegions(code);

              if (clientPool.length === 0) {
                const fallback = this.mockAnalysis(code, language);
                return {
                  ...fallback,
                  total_lines: totalLines,
                  ai_covered_lines: 0,
                  ai_coverage_percent: 0,
                  planned_ai_coverage_percent: 0,
                  heuristic_coverage_percent: 100,
                  heuristic_suspect_count: heuristicRegions.length,
                  coverage_complete: false,
                  limited_coverage: true,
                  scan_strategy: 'heuristic_only'
                };
              }

              if (totalLines <= SINGLE_REQUEST_MAX_LINES) {
                try {
                  const parsed = await this.requestAi(clientPool[0], activeModel, this.generateSecurityPrompt(code, language));
                  return {
                    ...parsed,
                    incomplete: false,
                    scan_status: 'complete',
                    source: 'ai_live',
                    model_used: activeModel,
                    total_lines: totalLines,
                    ai_covered_lines: totalLines,
                    ai_coverage_percent: 100,
                    planned_ai_coverage_percent: 100,
                    heuristic_coverage_percent: 100,
                    heuristic_suspect_count: heuristicRegions.length,
                    coverage_complete: true,
                    limited_coverage: false,
                    chunk_count: 1,
                    targeted_chunk_count: 0,
                    sample_chunk_count: 0,
                    scan_strategy: 'single_request'
                  };
                } catch (err) {
                  const fallback = this.buildIncompleteFallback(code, language, err.message);
                  return {
                    ...fallback,
                    total_lines: totalLines,
                    ai_covered_lines: 0,
                    ai_coverage_percent: 0,
                    planned_ai_coverage_percent: 100,
                    heuristic_coverage_percent: 100,
                    heuristic_suspect_count: heuristicRegions.length,
                    coverage_complete: false,
                    limited_coverage: true,
                    chunk_count: 1,
                    targeted_chunk_count: 0,
                    sample_chunk_count: 0,
                    scan_strategy: 'single_request'
                  };
                }
              }

              const isLarge = totalLines > LARGE_FILE_THRESHOLD;
              const chunks = isLarge ? selectLargeFileChunks(allLines, heuristicRegions) : buildFullChunks(allLines);
              const plannedCovered = countCoveredLines(chunks, totalLines);
              const envConcurrency = Number.parseInt(process.env.SCAN_MAX_CONCURRENCY || '', 10);
              const configuredConcurrency = Number.isFinite(envConcurrency) && envConcurrency > 0
                ? envConcurrency
                : DEFAULT_MAX_CONCURRENCY;

              let circuitBroken = false;
              let fatalErrorReason = '';

              const worker = async (chunk, chunkIndex) => {
                if (circuitBroken) return null;
                const assignedClient = clientPool[chunkIndex % clientPool.length];
                try {
                  const parsed = await this.requestAi(
                    assignedClient,
                    activeModel,
                    this.generateChunkSecurityPrompt(chunk.chunkLines, chunk.startLineNumber, language)
                  );
                  return { ok: true, ...parsed, ...chunk };
                } catch (err) {
                  if (isFatalAiError(err)) {
                    circuitBroken = true;
                    fatalErrorReason = err.message;
                  }
                  return {
                    ok: false,
                    error: err.message,
                    vulnerabilities: [],
                    recommendations: [],
                    overall_summary: '',
                    ...chunk
                  };
                }
              };

              let chunkResults;
              if (configuredConcurrency <= 1) {
                chunkResults = await mapSequential(chunks, worker, () => circuitBroken);
              } else {
                const results = new Array(chunks.length);
                let cursor = 0;
                async function runWorker() {
                  while (true) {
                    if (circuitBroken) return;
                    const index = cursor++;
                    if (index >= chunks.length) return;
                    results[index] = await worker(chunks[index], index);
                  }
                }
                await Promise.all(Array.from({ length: Math.min(configuredConcurrency, chunks.length) }, () => runWorker()));
                chunkResults = results;
              }

              const processed = chunkResults.filter(Boolean);
              const successful = processed.filter(item => item.ok);
              const failed = processed.filter(item => !item.ok);
              const aggregatedVulns = dedupeVulnerabilities(successful.flatMap(item => item.vulnerabilities || []));
              const recommendations = normalizeRecommendations(successful.flatMap(item => item.recommendations || []));
              const incomplete = failed.length > 0 || circuitBroken || successful.length < chunks.length;
              const actualCovered = countCoveredLines(successful, totalLines);
              const aiCoveragePercent = Number(((actualCovered / totalLines) * 100).toFixed(1));
              const plannedCoveragePercent = Number(((plannedCovered / totalLines) * 100).toFixed(1));
              const coverageComplete = !incomplete && actualCovered >= totalLines;
              const limitedCoverage = !coverageComplete;

              if (circuitBroken && successful.length === 0) {
                const fallback = this.buildIncompleteFallback(code, language, `Lỗi AI: ${fatalErrorReason}`);
                return {
                  ...fallback,
                  total_lines: totalLines,
                  ai_covered_lines: 0,
                  ai_coverage_percent: 0,
                  planned_ai_coverage_percent: plannedCoveragePercent,
                  heuristic_coverage_percent: 100,
                  heuristic_suspect_count: heuristicRegions.length,
                  coverage_complete: false,
                  limited_coverage: true,
                  chunk_count: chunks.length,
                  targeted_chunk_count: chunks.filter(c => c.kind === 'targeted').length,
                  sample_chunk_count: chunks.filter(c => c.kind === 'sample').length,
                  scan_strategy: isLarge ? 'targeted_plus_sampling' : 'full_chunks'
                };
              }

              const isSafe = !incomplete && aggregatedVulns.length === 0;
              let overallSummary;
              if (incomplete) {
                overallSummary = `Quét chưa hoàn tất: ${successful.length}/${chunks.length} phân đoạn thành công. AI coverage thực tế ${aiCoveragePercent}% (${actualCovered}/${totalLines} dòng); heuristic coverage 100%. Không thể kết luận mã nguồn an toàn.`;
              } else if (isLarge) {
                overallSummary = aggregatedVulns.length
                  ? `File lớn ${totalLines} dòng: AI kiểm tra ${aiCoveragePercent}% mã nguồn qua ${chunks.length} vùng targeted/sampling và phát hiện ${aggregatedVulns.length} nguy cơ. Heuristic đã rà 100% file.`
                  : `File lớn ${totalLines} dòng: không phát hiện finding trong ${aiCoveragePercent}% vùng được gửi AI (${actualCovered} dòng); heuristic đã rà 100% file. Đây là coverage có chọn mẫu, không đồng nghĩa AI đã đọc toàn bộ file.`;
              } else {
                overallSummary = aggregatedVulns.length
                  ? `Đã quét đầy đủ ${totalLines} dòng qua ${chunks.length} chunk và phát hiện ${aggregatedVulns.length} nguy cơ.`
                  : `Đã quét đầy đủ ${totalLines} dòng qua ${chunks.length} chunk (overlap ${CHUNK_OVERLAP}). Không phát hiện lỗ hổng trong lượt quét.`;
              }

              return {
                is_safe: isSafe,
                incomplete,
                scan_status: incomplete ? 'incomplete' : 'complete',
                overall_summary: overallSummary,
                vulnerabilities: aggregatedVulns,
                recommendations,
                failed_chunks: failed.map(item => ({
                  start_line: item.startLineNumber,
                  end_line: item.endLineNumber,
                  error: item.error
                })),
                chunk_count: chunks.length,
                targeted_chunk_count: chunks.filter(c => c.kind === 'targeted').length,
                sample_chunk_count: chunks.filter(c => c.kind === 'sample').length,
                overlap_lines: CHUNK_OVERLAP,
                is_targeted: isLarge,
                total_lines: totalLines,
                ai_covered_lines: actualCovered,
                ai_coverage_percent: aiCoveragePercent,
                planned_ai_coverage_percent: plannedCoveragePercent,
                heuristic_coverage_percent: 100,
                heuristic_suspect_count: heuristicRegions.length,
                coverage_complete: coverageComplete,
                limited_coverage: limitedCoverage,
                scan_strategy: isLarge ? 'targeted_plus_sampling' : 'full_chunks',
                source: isLarge ? 'ai_live_targeted_sampling' : 'ai_live_full_chunks',
                model_used: activeModel
              };
            }
          }
          EOF

      - name: Add project scanner service
        run: |
          cat > services/project-scanner.js <<'EOF'
          import path from 'path';

          export const SMALL_FILE_MAX_LINES = Number.parseInt(process.env.PROJECT_SMALL_FILE_LINES || '120', 10);
          export const SMALL_BATCH_MAX_LINES = Number.parseInt(process.env.PROJECT_BATCH_MAX_LINES || '400', 10);
          export const MAX_CROSS_FILE_CHECKS = Number.parseInt(process.env.PROJECT_MAX_CROSS_FILE_CHECKS || '4', 10);
          const PROJECT_THROTTLE_MS = Number.parseInt(process.env.PROJECT_SCAN_THROTTLE_MS || '150', 10);
          const SUPPORTED_EXTENSIONS = new Set(['js','jsx','ts','tsx','html','htm','php','py','java','go','cs','sql','c','cpp','rb','sh','json','yaml','yml']);
          const SKIP_RE = /(^|\/)(node_modules|dist|build|vendor|coverage|\.git|\.idea)(\/|$)|\.min\.(?:js|css)$/i;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          function normalizePath(value) {
            return String(value || '').replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
          }

          function lineCount(content) {
            return String(content || '').split('\n').length;
          }

          export function filterProjectFiles(files) {
            const accepted = [];
            const skipped = [];
            for (const raw of Array.isArray(files) ? files : []) {
              const filePath = normalizePath(raw.path || raw.name);
              const ext = filePath.includes('.') ? filePath.split('.').pop().toLowerCase() : '';
              if (!filePath || SKIP_RE.test(filePath) || !SUPPORTED_EXTENSIONS.has(ext)) {
                skipped.push({ path: filePath || raw.name || 'unknown', reason: 'unsupported_or_generated' });
                continue;
              }
              accepted.push({
                name: raw.name || path.posix.basename(filePath),
                path: filePath,
                content: String(raw.content || ''),
                language: raw.language || 'auto',
                lines: lineCount(raw.content)
              });
            }
            return { accepted, skipped };
          }

          function resolveDependency(rawSpec, fromPath, knownPaths) {
            if (!rawSpec) return null;
            const clean = String(rawSpec).split(/[?#]/)[0].trim();
            if (!clean || /^(?:https?:|data:|\/\/)/i.test(clean)) return null;
            let candidate = clean;
            if (clean.startsWith('.')) candidate = path.posix.normalize(path.posix.join(path.posix.dirname(fromPath), clean));
            else candidate = normalizePath(clean);
            candidate = normalizePath(candidate);
            const variants = [candidate];
            if (!path.posix.extname(candidate)) {
              variants.push(`${candidate}.js`, `${candidate}.jsx`, `${candidate}.ts`, `${candidate}.tsx`, `${candidate}.html`, `${candidate}/index.js`, `${candidate}/index.ts`);
            }
            for (const variant of variants) if (knownPaths.has(variant)) return variant;
            const suffixMatches = [...knownPaths].filter(p => variants.some(v => p.endsWith(`/${v}`) || p === v));
            return suffixMatches.length === 1 ? suffixMatches[0] : null;
          }

          export function buildDependencyGraph(files) {
            const known = new Set(files.map(file => file.path));
            const graph = Object.fromEntries(files.map(file => [file.path, []]));
            for (const file of files) {
              const specs = new Set();
              if (/\.(?:html?|htm)$/i.test(file.path)) {
                const scriptRe = /<script[^>]+src=["']([^"']+)["']/gi;
                let match;
                while ((match = scriptRe.exec(file.content))) specs.add(match[1]);
              }
              if (/\.(?:[cm]?js|jsx|ts|tsx)$/i.test(file.path)) {
                const importRe = /(?:import\s+(?:[^'"()]+?\s+from\s+)?|export\s+[^'"]*?\s+from\s+|require\s*\(|import\s*\()\s*["']([^"']+)["']/g;
                let match;
                while ((match = importRe.exec(file.content))) specs.add(match[1]);
              }
              for (const spec of specs) {
                const resolved = resolveDependency(spec, file.path, known);
                if (resolved && resolved !== file.path && !graph[file.path].includes(resolved)) graph[file.path].push(resolved);
              }
            }
            return graph;
          }

          function reverseGraph(graph) {
            const reversed = Object.fromEntries(Object.keys(graph).map(key => [key, []]));
            for (const [source, targets] of Object.entries(graph)) {
              for (const target of targets) {
                if (!reversed[target]) reversed[target] = [];
                reversed[target].push(source);
              }
            }
            return reversed;
          }

          function securityInterestScore(content) {
            const text = String(content || '');
            const patterns = [
              /req\.(?:query|params|body)|location\.(?:search|hash)|document\.cookie|\.value\b/i,
              /innerHTML|outerHTML|insertAdjacentHTML|document\.write|dangerouslySetInnerHTML/i,
              /\bexec(?:Sync)?\s*\(|\bspawn(?:Sync)?\s*\(|\bsystem\s*\(/i,
              /\bSELECT\b|\bINSERT\b|\bUPDATE\b|\bDELETE\b/i,
              /fetch\s*\(|axios\s*\(|http\.get\s*\(|https\.get\s*\(/i,
              /api[_-]?key|password|secret|token/i
            ];
            return patterns.reduce((score, regex) => score + (regex.test(text) ? 1 : 0), 0);
          }

          export function buildProjectScanPlan(files, graph) {
            const byPath = new Map(files.map(file => [file.path, file]));
            const reverse = reverseGraph(graph);
            const smallPaths = new Set(files.filter(file => file.lines <= SMALL_FILE_MAX_LINES).map(file => file.path));
            const assigned = new Set();
            const plans = [];

            for (const seed of files) {
              if (!smallPaths.has(seed.path) || assigned.has(seed.path)) continue;
              const group = [seed];
              assigned.add(seed.path);
              let lines = seed.lines + 2;
              const candidates = [
                ...(graph[seed.path] || []),
                ...(reverse[seed.path] || []),
                ...files.filter(f => path.posix.dirname(f.path) === path.posix.dirname(seed.path)).map(f => f.path),
                ...files.map(f => f.path)
              ];
              for (const candidatePath of [...new Set(candidates)]) {
                if (!smallPaths.has(candidatePath) || assigned.has(candidatePath)) continue;
                const candidate = byPath.get(candidatePath);
                if (!candidate) continue;
                const nextLines = lines + candidate.lines + 2;
                if (nextLines > SMALL_BATCH_MAX_LINES || group.length >= 8) continue;
                group.push(candidate);
                assigned.add(candidatePath);
                lines = nextLines;
              }
              plans.push({ kind: group.length > 1 ? 'batch' : 'single', files: group, estimatedLines: lines });
            }

            for (const file of files) {
              if (assigned.has(file.path)) continue;
              assigned.add(file.path);
              plans.push({ kind: 'single', files: [file], estimatedLines: file.lines });
            }

            const originalOrder = new Map(files.map((file, index) => [file.path, index]));
            return plans.sort((a, b) => originalOrder.get(a.files[0].path) - originalOrder.get(b.files[0].path));
          }

          export function combineFilesForScan(files) {
            const lines = [];
            const ranges = [];
            for (const file of files) {
              lines.push(`// === FILE: ${file.path} ===`);
              const startLine = lines.length + 1;
              const fileLines = String(file.content || '').split('\n');
              lines.push(...fileLines);
              const endLine = lines.length;
              ranges.push({ path: file.path, startLine, endLine, originalLines: fileLines.length });
              lines.push(`// === END FILE: ${file.path} ===`);
            }
            return { code: lines.join('\n'), ranges };
          }

          function mapFindingToRange(vuln, ranges) {
            const explicitFile = normalizePath(vuln.file);
            let range = explicitFile ? ranges.find(item => item.path === explicitFile) : null;
            const start = Number.parseInt(vuln.start_line || vuln.line_number, 10) || 1;
            if (!range) range = ranges.find(item => start >= item.startLine && start <= item.endLine);
            if (!range) return null;
            const end = Number.parseInt(vuln.end_line || start, 10) || start;
            return {
              ...vuln,
              file: range.path,
              start_line: Math.max(1, start - range.startLine + 1),
              end_line: Math.max(1, Math.min(range.originalLines, end - range.startLine + 1)),
              line_number: Math.max(1, start - range.startLine + 1)
            };
          }

          function dedupeFileFindings(items) {
            const seen = new Set();
            return (items || []).filter(item => {
              const key = [item.file || '', item.type || '', item.start_line || 1, item.end_line || item.start_line || 1].join('|').toLowerCase();
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });
          }

          function resultForBatchFile(batchResult, file, ranges) {
            const vulnerabilities = dedupeFileFindings((batchResult.vulnerabilities || [])
              .map(v => mapFindingToRange(v, ranges))
              .filter(v => v && v.file === file.path));
            return {
              ...batchResult,
              is_safe: !batchResult.incomplete && vulnerabilities.length === 0,
              vulnerabilities,
              total_lines: file.lines,
              ai_covered_lines: batchResult.incomplete ? 0 : file.lines,
              ai_coverage_percent: batchResult.incomplete ? 0 : 100,
              planned_ai_coverage_percent: 100,
              coverage_complete: !batchResult.incomplete,
              limited_coverage: Boolean(batchResult.incomplete),
              scan_strategy: 'project_small_file_batch',
              source: 'ai_project_batch',
              overall_summary: batchResult.incomplete
                ? `Batch chứa ${file.path} quét chưa hoàn tất; không thể kết luận file an toàn.`
                : vulnerabilities.length
                  ? `Phát hiện ${vulnerabilities.length} nguy cơ trong ${file.path} từ batch project.`
                  : `Đã quét ${file.path} trong batch project; không phát hiện finding trong file này.`
            };
          }

          function mergeCrossFindings(result, findings) {
            if (!result || !findings.length) return result;
            const merged = dedupeFileFindings([...(result.vulnerabilities || []), ...findings.map(v => ({ ...v, cross_file: true }))]);
            return {
              ...result,
              is_safe: result.incomplete ? false : merged.length === 0,
              vulnerabilities: merged,
              overall_summary: `${result.overall_summary || ''} Cross-file analysis bổ sung ${findings.length} finding liên quan dependency.`.trim()
            };
          }

          export class ProjectScannerService {
            constructor({ scanFile }) {
              if (typeof scanFile !== 'function') throw new Error('ProjectScannerService cần scanFile callback.');
              this.scanFile = scanFile;
            }

            async scanProject(rawFiles, customConfig = null) {
              const { accepted: files, skipped } = filterProjectFiles(rawFiles);
              if (!files.length) throw new Error('Không có file mã nguồn hợp lệ để quét project.');
              const graph = buildDependencyGraph(files);
              const plans = buildProjectScanPlan(files, graph);
              const results = new Map();
              const planIndex = new Map();
              let requestUnits = 0;
              let batchedGroups = 0;
              let filesBatched = 0;

              for (let planNo = 0; planNo < plans.length; planNo++) {
                const plan = plans[planNo];
                plan.files.forEach(file => planIndex.set(file.path, planNo));
                try {
                  if (plan.kind === 'batch') {
                    batchedGroups++;
                    filesBatched += plan.files.length;
                    const combined = combineFilesForScan(plan.files);
                    const batchResult = await this.scanFile(combined.code, 'auto', customConfig);
                    requestUnits += batchResult.chunk_count || 1;
                    for (const file of plan.files) results.set(file.path, resultForBatchFile(batchResult, file, combined.ranges));
                  } else {
                    const file = plan.files[0];
                    const result = await this.scanFile(file.content, file.language, customConfig);
                    requestUnits += result.chunk_count || 1;
                    result.vulnerabilities = (result.vulnerabilities || []).map(v => ({ ...v, file: file.path }));
                    results.set(file.path, result);
                  }
                } catch (err) {
                  for (const file of plan.files) {
                    results.set(file.path, {
                      is_safe: false,
                      incomplete: true,
                      scan_status: 'incomplete',
                      vulnerabilities: [],
                      recommendations: [],
                      overall_summary: `Quét file/project batch lỗi: ${err.message}`,
                      scan_error: err.message,
                      total_lines: file.lines,
                      ai_covered_lines: 0,
                      ai_coverage_percent: 0,
                      heuristic_coverage_percent: 100,
                      coverage_complete: false,
                      limited_coverage: true,
                      source: 'project_scan_error'
                    });
                  }
                }
                if (PROJECT_THROTTLE_MS > 0 && planNo < plans.length - 1) await sleep(PROJECT_THROTTLE_MS);
              }

              const byPath = new Map(files.map(file => [file.path, file]));
              const crossFindings = [];
              let crossChecks = 0;
              outer: for (const [source, targets] of Object.entries(graph)) {
                for (const target of targets) {
                  if (crossChecks >= MAX_CROSS_FILE_CHECKS) break outer;
                  if (planIndex.get(source) === planIndex.get(target)) continue;
                  const a = byPath.get(source);
                  const b = byPath.get(target);
                  if (!a || !b || a.lines + b.lines + 4 > SMALL_BATCH_MAX_LINES) continue;
                  if (securityInterestScore(a.content) + securityInterestScore(b.content) === 0) continue;
                  const combined = combineFilesForScan([a, b]);
                  const crossResult = await this.scanFile(combined.code, 'auto', customConfig);
                  requestUnits += crossResult.chunk_count || 1;
                  crossChecks++;
                  const mapped = dedupeFileFindings((crossResult.vulnerabilities || [])
                    .map(v => mapFindingToRange(v, combined.ranges))
                    .filter(Boolean)
                    .map(v => ({ ...v, cross_file: true, dependency_edge: `${source} -> ${target}` })));
                  for (const filePath of [source, target]) {
                    const additions = mapped.filter(v => v.file === filePath);
                    if (additions.length) results.set(filePath, mergeCrossFindings(results.get(filePath), additions));
                  }
                  crossFindings.push(...mapped);
                  if (PROJECT_THROTTLE_MS > 0) await sleep(PROJECT_THROTTLE_MS);
                }
              }

              const fileResults = files.map(file => ({ path: file.path, result: results.get(file.path) }));
              const allResults = fileResults.map(item => item.result).filter(Boolean);
              const incompleteFiles = allResults.filter(r => r.incomplete).length;
              const limitedCoverageFiles = allResults.filter(r => r.limited_coverage && !r.incomplete).length;
              const totalVulnerabilities = allResults.reduce((sum, r) => sum + (r.vulnerabilities?.length || 0), 0);
              const status = incompleteFiles > 0
                ? 'incomplete'
                : totalVulnerabilities > 0
                  ? 'vulnerable'
                  : limitedCoverageFiles > 0
                    ? 'limited_coverage'
                    : 'safe';

              return {
                status,
                file_results: fileResults,
                project_findings: dedupeFileFindings(crossFindings),
                dependency_graph: graph,
                skipped_files: skipped,
                stats: {
                  total_input_files: Array.isArray(rawFiles) ? rawFiles.length : 0,
                  scanned_files: files.length,
                  skipped_files: skipped.length,
                  scan_groups: plans.length,
                  batched_groups: batchedGroups,
                  files_batched: filesBatched,
                  cross_file_checks: crossChecks,
                  ai_request_units: requestUnits,
                  incomplete_files: incompleteFiles,
                  limited_coverage_files: limitedCoverageFiles,
                  total_vulnerabilities: totalVulnerabilities
                }
              };
            }
          }
          EOF

      - name: Patch server and default Groq config
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.js').read_text(encoding='utf-8')
          server = server.replace(
              "import { ScannerService, DEFAULT_OPENCODE_API_KEY } from './services/scanner.js';",
              "import { ScannerService, DEFAULT_OPENCODE_API_KEY } from './services/groq-scanner.js';\nimport { ProjectScannerService } from './services/project-scanner.js';"
          )
          marker = "// ScannerService giữ nguyên interface OpenAI-compatible. Với provider custom,"
          project_init = """const projectScannerService = new ProjectScannerService({\n  scanFile: async (code, language, customConfig) => customConfig\n    ? scannerService.scanCode(code, language || 'auto', customConfig)\n    : scanWithDefaultOpenCodePool(code, language || 'auto')\n});\n\n"""
          if project_init not in server:
              server = server.replace(marker, project_init + marker)

          route_marker = "// API: Quét lỗ hổng bảo mật trực tiếp"
          project_route = r'''// API: Quét project/folder với queue, gom file nhỏ và cross-file dependency analysis
          app.post('/api/scan-project', async (req, res) => {
            const { files, apiKey, provider, model, baseURL } = req.body;
            if (!Array.isArray(files) || files.length === 0) {
              return res.status(400).json({ success: false, error: 'Vui lòng cung cấp danh sách file mã nguồn.' });
            }
            if (files.length > 500) {
              return res.status(400).json({ success: false, error: 'Tối đa 500 file mỗi lượt quét project.' });
            }

            try {
              let customConfig = null;
              if (provider === 'custom') {
                const targetModel = typeof model === 'string' ? model.trim() : '';
                if (!targetModel) return res.status(400).json({ success: false, error: 'Universal AI API cần tên Model.' });
                const universalConfig = normalizeUniversalConfig(req.body);
                const keys = getCustomKeys(apiKey, universalConfig.authType);
                customConfig = {
                  apiKey: keys.join('\n'),
                  provider: 'custom',
                  model: targetModel,
                  baseURL: packUniversalConfig(universalConfig)
                };
              } else if (
                apiKey && typeof apiKey === 'string' && apiKey.trim() && !isLegacyBrowserDefaultKey(apiKey)
              ) {
                customConfig = { apiKey, provider, model, baseURL };
              }

              const result = await projectScannerService.scanProject(files, customConfig);
              return res.json({ success: true, timestamp: new Date().toISOString(), result });
            } catch (err) {
              console.error('Lỗi khi quét project:', err);
              return res.status(500).json({ success: false, error: err.message || 'Đã xảy ra lỗi khi quét project.' });
            }
          });

          '''
          if "app.post('/api/scan-project'" not in server:
              server = server.replace(route_marker, project_route + route_marker)
          Path('server.js').write_text(server, encoding='utf-8')

          env = '''# Provider mặc định: Groq Cloud AI\nAI_PROVIDER=groq\n\n# Tạo API key tại Groq Console và đặt vào GROQ_API_KEY ở máy chạy server.\n# KHÔNG commit API key thật vào repository.\nGROQ_API_KEY=your_groq_api_key_here\nMODEL=llama-3.3-70b-versatile\n\n# Web Server Port\nWEB_PORT=3000\n\n# Groq: chạy chunk tuần tự để tránh đụng TPM/RPM.\nSCAN_MAX_CONCURRENCY=1\nSCAN_SINGLE_LIMIT=400\nSCAN_CHUNK_SIZE=450\nSCAN_CHUNK_OVERLAP=50\nSCAN_LARGE_THRESHOLD=3000\nSCAN_MAX_TARGETED_CHUNKS=8\nSCAN_MAX_LARGE_CHUNKS=10\nSCAN_COVERAGE_SAMPLES=3\nSCAN_COVERAGE_SAMPLE_SIZE=300\n\n# Project/folder scanning\nPROJECT_SMALL_FILE_LINES=120\nPROJECT_BATCH_MAX_LINES=400\nPROJECT_MAX_CROSS_FILE_CHECKS=4\nPROJECT_SCAN_THROTTLE_MS=150\n\nLANGUAGE=Tiếng Việt\n'''
          Path('.env.example').write_text(env, encoding='utf-8')

      - name: Add scanner/project tests
        run: |
          cat > test/groq-project-scanner.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            ScannerService,
            SINGLE_REQUEST_MAX_LINES,
            CHUNK_SIZE,
            findSuspectRegions,
            selectLargeFileChunks,
            countCoveredLines,
            isFatalAiError
          } from '../services/groq-scanner.js';
          import {
            filterProjectFiles,
            buildDependencyGraph,
            buildProjectScanPlan,
            ProjectScannerService
          } from '../services/project-scanner.js';

          test('groq scanner defaults use 400/450 line strategy', () => {
            assert.equal(SINGLE_REQUEST_MAX_LINES, 400);
            assert.equal(CHUNK_SIZE, 450);
          });

          test('heuristic risk scoring prioritizes command injection over weak crypto', () => {
            const regions = findSuspectRegions('const a = md5(x);\nexec("ping " + req.query.host);');
            assert.equal(regions[0].type, 'command-injection');
            assert.ok(regions[0].risk > regions[1].risk);
          });

          test('large file with no suspects samples beginning, middle and end instead of only first chunk', () => {
            const lines = Array.from({ length: 6000 }, (_, i) => `const x${i} = ${i};`);
            const chunks = selectLargeFileChunks(lines, []);
            assert.ok(chunks.length >= 3);
            assert.equal(chunks[0].startLineNumber, 1);
            assert.ok(chunks.some(c => c.startLineNumber > 2000 && c.endLineNumber < 5000));
            assert.equal(chunks.at(-1).endLineNumber, 6000);
            assert.ok(countCoveredLines(chunks, 6000) > 450);
          });

          test('targeted large scan remains capped and includes sampling coverage', () => {
            const lines = Array.from({ length: 10000 }, (_, i) => `line ${i + 1}`);
            const suspects = Array.from({ length: 100 }, (_, i) => ({ line: 50 + i * 90, risk: 100 - (i % 40), type: 'test' }));
            const chunks = selectLargeFileChunks(lines, suspects);
            assert.ok(chunks.length <= 10);
            assert.ok(chunks.some(c => c.kind === 'targeted'));
            assert.ok(chunks.some(c => c.kind === 'sample'));
          });

          test('404 is fatal configuration error', () => {
            assert.equal(isFatalAiError(Object.assign(new Error('model not found'), { status: 404 })), true);
          });

          test('validateAiResult repairs findings/issues schema', () => {
            const service = new ScannerService();
            const repaired = service.validateAiResult({ findings: [{ type: 'XSS', line_number: 9 }], suggestions: ['escape output'] });
            assert.equal(repaired.vulnerabilities.length, 1);
            assert.equal(repaired.vulnerabilities[0].start_line, 9);
            assert.deepEqual(repaired.recommendations, ['escape output']);
          });

          test('project filter accepts js/html and skips generated/minified directories', () => {
            const { accepted, skipped } = filterProjectFiles([
              { path: 'index.html', content: '<script src="app.js"></script>' },
              { path: 'app.js', content: 'console.log(1)' },
              { path: 'dist/app.min.js', content: 'x=1' },
              { path: 'logo.png', content: '' }
            ]);
            assert.deepEqual(accepted.map(f => f.path), ['index.html', 'app.js']);
            assert.equal(skipped.length, 2);
          });

          test('dependency graph connects HTML script src and JS imports', () => {
            const { accepted } = filterProjectFiles([
              { path: 'index.html', content: '<script src="./js/app.js"></script>' },
              { path: 'js/app.js', content: "import { login } from './auth.js';" },
              { path: 'js/auth.js', content: 'export const login = () => true;' }
            ]);
            const graph = buildDependencyGraph(accepted);
            assert.deepEqual(graph['index.html'], ['js/app.js']);
            assert.deepEqual(graph['js/app.js'], ['js/auth.js']);
          });

          test('project scan plan batches small related files under 400 lines', () => {
            const { accepted } = filterProjectFiles([
              { path: 'a.js', content: "import './b.js';\n" + 'a\n'.repeat(50) },
              { path: 'b.js', content: 'b\n'.repeat(60) },
              { path: 'big.js', content: 'x\n'.repeat(600) }
            ]);
            const graph = buildDependencyGraph(accepted);
            const plan = buildProjectScanPlan(accepted, graph);
            assert.ok(plan.some(item => item.kind === 'batch' && item.files.length >= 2));
            assert.ok(plan.some(item => item.files[0].path === 'big.js'));
          });

          test('project scanner maps batched findings back to original file lines', async () => {
            const fakeScan = async code => {
              const lines = code.split('\n');
              const marker = lines.findIndex(line => line.includes('FILE: b.js'));
              return {
                is_safe: false,
                incomplete: false,
                vulnerabilities: [{ type: 'DOM XSS', start_line: marker + 3, end_line: marker + 3 }],
                recommendations: [],
                overall_summary: 'finding',
                chunk_count: 1
              };
            };
            const svc = new ProjectScannerService({ scanFile: fakeScan });
            const result = await svc.scanProject([
              { path: 'a.js', content: "import './b.js';\nconst a = 1;", language: 'javascript' },
              { path: 'b.js', content: 'const x = 1;\npanel.innerHTML = userInput;', language: 'javascript' }
            ]);
            const b = result.file_results.find(item => item.path === 'b.js').result;
            assert.equal(b.vulnerabilities.length, 1);
            assert.equal(b.vulnerabilities[0].start_line, 2);
          });
          EOF

