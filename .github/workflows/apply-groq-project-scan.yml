        run: |
          git rm .github/workflows/apply-groq-project-scan.yml
          git add .env.example server.js services/groq-scanner.js services/project-scanner.js test/groq-project-scanner.test.js
          git commit -m "feat: add Groq-aware large-file and project scanning"
          git push origin HEAD:fix/groq-large-file-project-scan
